name: ETL Every 3h (:33 UTC)

on:
  schedule:
    - cron: "33 */3 * * *"
  workflow_dispatch:

# Prevent overlapping runs (manual + scheduled).
concurrency:
  group: daily-etl
  cancel-in-progress: false

jobs:
  run-etl:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: abatilo/actions-poetry@v3
        with:
          poetry-version: "2.4.1"

      - name: Install dependencies
        run: |
          poetry config virtualenvs.in-project true
          poetry install --no-interaction --no-ansi

      - name: Run full ETL
        id: etl
        env:
          BIGQUERY_PROJECT_ID: ${{ secrets.BIGQUERY_PROJECT_ID }}
          BIGQUERY_DATASET_ID: ${{ secrets.BIGQUERY_DATASET_ID }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          GOOGLE_SERVICE_ACCOUNT_INFO: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_INFO }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -o pipefail
          poetry run python -m src.data.datamodel.build_datamodel 2>&1 | tee etl_output.log

      - name: Print summary (last 60 lines)
        if: always()
        run: tail -60 etl_output.log || true

      - name: Upload full log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etl-log-${{ github.run_id }}
          path: etl_output.log
          retention-days: 14

      - name: Mark job failed on ETL error
        if: failure()
        run: |
          echo "::error::Daily ETL failed. See uploaded artifact 'etl-log-${{ github.run_id }}' and the etl_run_status BigQuery table for details."
          exit 1
