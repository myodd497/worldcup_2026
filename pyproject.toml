[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "src"
version = "0.1.0"
description = "World Cup 2026 AI Insights Platform"
requires-python = ">=3.11"

dependencies = [
    # --- Core data & ML (existing) ---
    "numpy>=2.2",
    "pandas>=2.2",
    "scikit-learn>=1.6",
    "matplotlib>=3.10",
    "xgboost>=2.0",
    "joblib>=1.4",
    "mlflow>=2.15",

    # --- Notebooks ---
    "jupyterlab>=4.3",
    "ipykernel>=6.0",

    # --- Database ---
    "google-cloud-bigquery>=3.25",
    "google-cloud-bigquery-storage>=2.27",
    "pyarrow>=17.0",
    "db-dtypes>=1.3",

    # --- Agent framework ---
    "langgraph>=0.2",
    "langchain>=0.3",
    "langchain-openai>=0.2",
    "langchain-anthropic>=0.2",
    "langchain-community>=0.3",

    # --- Web server / WhatsApp ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "twilio>=9.3",
    "pydantic>=2.9",
    "python-multipart>=0.0.12",

    # --- External API clients ---
    "tavily-python>=0.5",
    "newsapi-python>=0.2",
    "tweepy>=4.14",
    "httpx>=0.27",

    # --- Sentiment analysis ---
    "vaderSentiment>=3.3",
    "transformers>=4.45",
    "torch>=2.4",
    "torchvision>=0.19",

    # --- Config & secrets ---
    "python-dotenv>=1.0",

    # --- Dev quality tools ---
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pandas-gbq>=0.35.0,<0.36.0",
    "streamlit>=1.58.0,<2.0.0",
    "plotly>=5.22",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ipykernel>=6.0",
]

